{{- if .Values.ultraserverOperator.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: protect-capacity-block-id-label
  labels:
    app: {{ include "neuron-ultraserver-operator.fullname" . }}
    {{- include "neuron-ultraserver-operator.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["UPDATE"]
      resources: ["nodes"]
  validations:
  - expression: >-
      ('topology.k8s.aws/capacity-block-id' in object.metadata.labels) ==
      ('topology.k8s.aws/capacity-block-id' in oldObject.metadata.labels) &&
      (!('topology.k8s.aws/capacity-block-id' in object.metadata.labels) ||
      object.metadata.labels['topology.k8s.aws/capacity-block-id'] ==
      oldObject.metadata.labels['topology.k8s.aws/capacity-block-id'])
    message: "topology.k8s.aws/capacity-block-id label cannot be added, modified, or removed"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: protect-capacity-block-id-label
  labels:
    app: {{ include "neuron-ultraserver-operator.fullname" . }}
    {{- include "neuron-ultraserver-operator.labels" . | nindent 4 }}
spec:
  policyName: protect-capacity-block-id-label
  validationActions:
  - Deny
{{- end }}
