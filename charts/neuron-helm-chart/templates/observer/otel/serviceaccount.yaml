{{- if and .Values.observer.enabled .Values.observer.otel.serviceAccount.create .Values.observer.daemon.config.export.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.observer.otel.serviceAccount.name }}
  namespace: {{ include "neuron-observer-daemon.namespace" . }}
  labels:
    {{- include "neuron-observer-daemon.labels" . | nindent 4 }}
  {{- with .Values.observer.otel.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
