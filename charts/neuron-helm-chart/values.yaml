neuronInstances: [ trn1.2xlarge, trn1.32xlarge, trn1n.32xlarge, trn2.48xlarge, trn2u.48xlarge, inf1.xlarge, inf1.2xlarge, inf1.6xlarge, inf1.24xlarge, inf2.xlarge, inf2.8xlarge, inf2.24xlarge, inf2.48xlarge, ml.inf2.xlarge, ml.inf2.8xlarge, ml.inf2.24xlarge, ml.inf2.48xlarge, ml.trn1.2xlarge, ml.trn1.32xlarge, ml.trn1n.32xlarge ]

devicePlugin:
  nameOverride: neuron-device-plugin
  namespaceOverride: kube-system
  fullnameOverride: neuron-device-plugin
  selectorLabelsOverride: {}
  priorityClassName: system-node-critical
  runtimeClassName: null
  imagePullSecrets: []
  image:
    repository: public.ecr.aws/neuron/neuron-device-plugin
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: "2.23.30.0"
  podSecurityContext: {}
  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: neuron-device-plugin
  updateStrategy:
    type: RollingUpdate
  podAnnotations: {}
  securityContext: {}
  nodeSelector: {}
  tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
  - key: aws.amazon.com/neuron
    operator: Exists
    effect: NoSchedule
  - key: sagemaker.amazonaws.com/node-health-status
    operator: Equal
    value: Unschedulable
    effect: NoSchedule
  env:
    - name: KUBECONFIG
      value: /etc/kubernetes/kubelet.conf
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: "__INSTANCE_TYPE_KEY__"
                operator: In
                values: "__NEURON_INSTANCES__"
              - key: eks.amazonaws.com/compute-type
                operator: NotIn
                values:
                - fargate
                - hybrid
                - auto
  volumeMounts:
    - name: device-plugin
      mountPath: /var/lib/kubelet/device-plugins
    - name: infa-map
      mountPath: /run
    - name: aws-config
      mountPath: /opt/aws
      readOnly: true
  volumes:
    - name: device-plugin
      hostPath:
        path: /var/lib/kubelet/device-plugins
    - name: infa-map
      hostPath:
        path: /run
    - name: aws-config
      hostPath:
        path: /opt/aws

scheduler:
  enabled: false
  image:
    repository: public.ecr.aws/neuron/neuron-scheduler
    pullPolicy: IfNotPresent
    tag: "2.23.30.0"
  imagePullSecrets: []
  nameOverride: neuron-scheduler
  namespaceOverride: kube-system
  fullnameOverride: k8s-neuron-scheduler
  replicaCount: 1
  strategy:
    type: Recreate
  priorityClassName: system-node-critical
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector:
    node-role.kubernetes.io/master: ""
  tolerations:
  - effect: NoSchedule
    operator: Exists
    key: node-role.kubernetes.io/master
  - effect: NoSchedule
    operator: Exists
    key: node.cloudprovider.kubernetes.io/uninitialized
  affinity: {}
  env:
    - name: PORT
      value: "12345"
  customScheduler:
    enabled: true
    nameOverride: ""
    namespaceOverride: kube-system
    fullnameOverride: my-scheduler
    image:
      repository: public.ecr.aws/eks-distro/kubernetes/kube-scheduler
      pullPolicy: IfNotPresent
      tag: "v1.28.5-eks-1-28-latest"
    replicaCount: 1
    serviceAccount:
      create: true
      annotations: {}
      name: ""
    livenessProbe:
      httpGet:
        path: /healthz
        port: 10259
        scheme: HTTPS
      initialDelaySeconds: 15
    readinessProbe:
      httpGet:
        path: /healthz
        port: 10259
        scheme: HTTPS
    resources:
      requests:
        cpu: '0.1'
    securityContext:
      privileged: false
    nodeSelector: {}
    tolerations: []
    affinity: {}
  defaultScheduler:
    enabled: false

npd:
  enabled: true
  updateStrategy:
    type: RollingUpdate
  config:
    name: node-problem-detector-config
  imagePullSecrets: []
  nameOverride: node-problem-detector
  namespaceOverride: neuron-healthcheck-system
  fullnameOverride: node-problem-detector
  selectorLabelsOverride: {}
  serviceAccount:
    create: true
    annotations: {}
    name: node-problem-detector
  podAnnotations: {}
  podSecurityContext: {}
  priorityClassName: ""
  runtimeClassName: ""
  nodeSelector: {}
  tolerations:
  - effect: NoSchedule
    operator: Exists
  - effect: NoExecute
    operator: Exists
  nodeProblemDetector:
    image:
      repository: registry.k8s.io/node-problem-detector/node-problem-detector
      pullPolicy: IfNotPresent
      tag: "v0.8.20"
    resources:
      limits:
        cpu: 10m
        memory: 80Mi
      requests:
        cpu: 10m
        memory: 80Mi
    securityContext: {}
    clusterRole:
      create: false
  nodeRecovery:
    enabled: false
    image:
      repository: public.ecr.aws/neuron/neuron-node-recovery
      pullPolicy: IfNotPresent
      tag: "1.4.0"
    resources:
      limits:
        cpu: 10m
        memory: 150Mi
      requests:
        cpu: 10m
        memory: 150Mi
