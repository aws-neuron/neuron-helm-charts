{{- if and .Values.observer.enabled .Values.observer.daemon.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "neuron-observer-daemon.serviceAccountName" . }}
  namespace: {{ include "neuron-observer-daemon.namespace" . }}
  labels:
    {{- include "neuron-observer-daemon.labels" . | nindent 4 }}
  {{- with .Values.observer.daemon.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
