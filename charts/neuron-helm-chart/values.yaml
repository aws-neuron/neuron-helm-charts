neuronInstances: [trn1.2xlarge, trn1.32xlarge, trn1n.32xlarge, trn2.3xlarge, trn2.48xlarge, trn2u.48xlarge, trn3.48xlarge, trn3n.48xlarge, trn3en.24xlarge, trn3s-es.48xlarge, inf1.xlarge, inf1.2xlarge, inf1.6xlarge, inf1.24xlarge, inf2.xlarge, inf2.8xlarge, inf2.24xlarge, inf2.48xlarge, ml.inf2.xlarge, ml.inf2.8xlarge, ml.inf2.24xlarge, ml.inf2.48xlarge, ml.trn1.2xlarge, ml.trn1.32xlarge, ml.trn1n.32xlarge]
draDriver:
  enabled: false
  nameOverride: neuron-dra-driver
  namespaceOverride: neuron-dra-driver
  fullnameOverride: neuron-dra-driver-kubelet-plugin
  selectorLabelsOverride: {}
  priorityClassName: null
  runtimeClassName: null
  imagePullSecrets: []
  image:
    repository: public.ecr.aws/neuron/neuron-dra-driver
    pullPolicy: IfNotPresent
    tag: "1.3.0"
  podSecurityContext: {}
  serviceAccount:
    create: true
    annotations: {}
    name: neuron-dra-driver-sa
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  podAnnotations: {}
  securityContext: {}
  resources:
    limits:
      cpu: 20m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 128Mi
  nodeSelector: {}
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
    - key: aws.amazon.com/neuron
      operator: Exists
      effect: NoSchedule
    - key: sagemaker.amazonaws.com/node-health-status
      operator: Equal
      value: Unschedulable
      effect: NoSchedule
  env:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: POD_UID
      valueFrom:
        fieldRef:
          fieldPath: metadata.uid
    - name: CDI_ROOT
      value: "/var/run/cdi"
    - name: KUBELET_REGISTRAR_DIRECTORY_PATH
      value: "/var/lib/kubelet/plugins_registry"
    - name: KUBELET_PLUGINS_DIRECTORY_PATH
      value: "/var/lib/kubelet/plugins"
    - name: HEALTHCHECK_PORT
      value: "51515"
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: "__INSTANCE_TYPE_KEY__"
                operator: In
                values: "__NEURON_INSTANCES__"
              - key: eks.amazonaws.com/compute-type
                operator: NotIn
                values:
                  - fargate
                  - hybrid
                  - auto
  volumeMounts:
    - name: kubelet-plugins-dir
      mountPath: /var/lib/kubelet/plugins
    - name: kubelet-registry-dir
      mountPath: /var/lib/kubelet/plugins_registry
    - name: cdi-dir
      mountPath: /var/run/cdi
  volumes:
    - name: kubelet-plugins-dir
      hostPath:
        path: /var/lib/kubelet/plugins
    - name: kubelet-registry-dir
      hostPath:
        path: /var/lib/kubelet/plugins_registry
    - name: cdi-dir
      hostPath:
        path: /var/run/cdi
  livenessProbe:
    grpc:
      port: 51515
      service: liveness
    failureThreshold: 3
    periodSeconds: 10
    initialDelaySeconds: 30
    timeoutSeconds: 5
  deviceHealthMonitoring:
    enabled: false
