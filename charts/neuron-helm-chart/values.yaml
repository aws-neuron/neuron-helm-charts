npd:
  enabled: true
  updateStrategy:
    type: RollingUpdate
  config:
    name: node-problem-detector-config
    kernelMonitor: |
      {
          "plugin": "kmsg",
          "logPath": "/dev/kmsg",
          "lookback": "5m",
          "bufferSize": 10,
          "source": "kernel-monitor",
          "conditions": [
              {
                  "type": "NeuronHealth",
                  "reason": "NeuronHasNoError",
                  "message": "Neuron has no error"
              }
          ],
          "rules": [
              {
                  "type": "permanent",
                  "condition": "NeuronHealth",
                  "reason": "NeuronHasError_NC_UNCORRECTABLE_ERROR",
                  "pattern": ".* NEURON_HW_ERR=NC_UNCORRECTABLE_ERROR .*"
              },
              {
                  "type": "permanent",
                  "condition": "NeuronHealth",
                  "reason": "NeuronHasError_HBM_UNCORRECTABLE_ERROR",
                  "pattern": ".* NEURON_HW_ERR=HBM_UNCORRECTABLE_ERROR .*"
              },
              {
                  "type": "permanent",
                  "condition": "NeuronHealth",
                  "reason": "NeuronHasError_DMA_ERROR",
                  "pattern": ".* NEURON_HW_ERR=DMA_ERROR .*"
              }
          ]
      }
  imagePullSecrets: []
  nameOverride: node-problem-detector
  namespaceOverride: neuron-healthcheck-system
  fullnameOverride: node-problem-detector
  selectorLabelsOverride: {}
  serviceAccount:
    create: true
    annotations: {}
    name: node-problem-detector
  podAnnotations: {}
  podSecurityContext: {}
  priorityClassName: ""
  runtimeClassName: ""
  nodeSelector: {}
  tolerations:
    - effect: NoSchedule
      operator: Exists
    - effect: NoExecute
      operator: Exists
  nodeProblemDetector:
    image:
      repository: registry.k8s.io/node-problem-detector/node-problem-detector
      pullPolicy: IfNotPresent
      tag: "v1.37.0"
      command:
        - /bin/sh
        - -c
        - |
          echo "Starting NPD with periodic FD health check (every 5s)..."

          # Start NPD in background
          /node-problem-detector \
            --logtostderr \
            --config.system-log-monitor=/config/kernel-monitor.json 2>&1 &

          NPD_PID=$!
          echo "NPD started with PID: $NPD_PID"

          # Periodic health check loop
          while true; do
            sleep 5

            # Check if NPD process is still running
            if ! kill -0 $NPD_PID 2>/dev/null; then
              echo "NPD process died, exiting..."
              exit 1
            fi

            # Check if NPD still has /dev/kmsg file descriptor open
            if ! ls -l /proc/$NPD_PID/fd/ 2>/dev/null | grep -q "/dev/kmsg"; then
              echo "FATAL: NPD no longer has /dev/kmsg FD open, exiting..."
              kill -9 $NPD_PID
              exit 1
            fi
          done
    resources:
      limits:
        cpu: 10m
        memory: 80Mi
      requests:
        cpu: 10m
        memory: 80Mi
    securityContext: {}
    clusterRole:
      create: false
  nodeRecovery:
    enabled: false
    startupDelaySeconds: 60
    image:
      repository: public.ecr.aws/neuron/neuron-node-recovery
      pullPolicy: IfNotPresent
      tag: "1.13.0"
    resources:
      limits:
        cpu: 10m
        memory: 150Mi
      requests:
        cpu: 10m
        memory: 150Mi
    counters:
      - NeuronHasError_DMA_ERROR
      - NeuronHasError_HBM_UNCORRECTABLE_ERROR
      - NeuronHasError_NC_UNCORRECTABLE_ERROR
    extraEnvs:
      - name: AWS_STS_REGIONAL_ENDPOINTS
        value: "regional"
# Neuron Observer: daemon and optional OTel collector.
observer:
  enabled: false
  image:
    repository: public.ecr.aws/neuron/neuron-observer
    pullPolicy: IfNotPresent
    tag: "0.2.0"
  namespace:
    create: false
  # Monitoring integrations. The PodMonitor is created when the
  # monitoring.coreos.com/v1 CRD exists; set enabled to override.
  monitoring:
    # `release` label used by kube-prometheus-stack selectors ("" omits it).
    releaseLabel: monitoring
    additionalLabels: {}
    # Reference Grafana dashboards packaged as ConfigMaps for sidecar discovery.
    grafanaDashboards:
      enabled: false
      # The namespace must exist and be watched by the Grafana sidecar.
      namespace: monitoring
      label: grafana_dashboard
      labelValue: "1"
      additionalLabels: {}
      annotations: {}
    podMonitor:
      enabled: null
      interval: 30s
      # Optional endpoint and label overrides.
      # scrapeTimeout: 10s
      # releaseLabel: monitoring
      additionalLabels: {}
    # Reference alerts (templates/observer/monitoring/prometheusrule.yaml). Opt-in; requires the PodMonitor.
    prometheusRule:
      enabled: false
      # Optional override; unset inherits monitoring.releaseLabel.
      # releaseLabel: monitoring
      additionalLabels: {}
      # `helm test` that checks the rules loaded in Prometheus.
      test:
        enabled: false
        prometheusUrl: "http://prometheus-operated.monitoring:9090"
        deadlineSecs: 60
        intervalSecs: 5
  daemon:
    # Also the scraped `job` label used by the reference alerts.
    nameOverride: neuron-observer
    namespaceOverride: neuron-observer
    fullnameOverride: neuron-observer
    selectorLabelsOverride: {}
    priorityClassName: null
    imagePullSecrets: []
    serviceAccount:
      create: true
      name: neuron-observer
      annotations: {}
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
    # Size of the in-memory /tmp used by the health check.
    tmpSizeLimit: 64Mi
    # Required for EFA metrics.
    hostNetwork: true
    podAnnotations: {}
    podSecurityContext: {}
    securityContext:
      privileged: true
      readOnlyRootFilesystem: true
    resources:
      requests:
        cpu: 250m
        memory: 128Mi
    # Label applied by the Neuron device plugin or DRA driver.
    nodeSelector:
      neuron.amazonaws.com/present: "true"
    tolerations:
      - key: aws.amazon.com/neuron
        operator: Exists
        effect: NoSchedule
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: "__INSTANCE_TYPE_KEY__"
                  operator: In
                  values: "__NEURON_INSTANCES__"
    env:
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
    extraVolumeMounts: []
    extraVolumes: []
    livenessProbe:
      httpGet:
        path: /healthz
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /readyz
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    config:
      collection:
        interval_secs: 5
        proc_path: "/host-proc"
        sources:
          device: true
          sysfs: true
          system: true
          imds: true
        latency_stream:
          enabled: true
          poll_interval_us: 50
      export:
        enabled: false
        interval_secs: 5
      logging:
        level: "info"
        format: "json"
      daemon:
        listen_address: "0.0.0.0"
        port: 7001
        shutdown_timeout_secs: 5
      emulation:
        enabled: false
  # OTel collector ServiceAccount. Add an IRSA role ARN for CloudWatch/AMP, e.g.
  # eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/neuron-observer-otel
  otel:
    serviceAccount:
      create: true
      name: neuron-observer-otel
      annotations: {}
  # Deployed when daemon.config.export.enabled is true.
  otelDaemonCollector:
    namespaceOverride: neuron-observer
    fullnameOverride: neuron-observer-daemon
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    awsRegion: "" # required for cloudwatch/amp, e.g. us-west-2
    pipelines:
      cloudwatch:
        enabled: false
        namespace: "NeuronObserver"
        logGroupName: "/metrics/neuron-observer"
        logStreamName: "otel-metrics"
        storageResolution: 1
        # Replaces the default awsemf metric_declarations, e.g.
        # [{dimensions: [["instance_id", "neuron_device_index"]], metric_name_selectors: ["neuron.device.*"]}]
        metricDeclarationsOverride: null
      amp:
        enabled: false
        endpoint: "" # e.g. https://aps-workspaces.us-west-2.amazonaws.com/workspaces/ws-XXXX/api/v1/remote_write
      otlp:
        enabled: false
        endpoint: "" # e.g. http://localhost:4319
