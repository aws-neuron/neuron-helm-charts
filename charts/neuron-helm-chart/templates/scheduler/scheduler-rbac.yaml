{{- if .Values.scheduler.enabled }}
{{- if .Values.scheduler.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "neuron-scheduler.serviceAccountName" . }}
  namespace: {{ include "neuron-scheduler.namespace" . }}
  labels:
    {{- include "neuron-scheduler.labels" . | nindent 4 }}
  {{- with .Values.scheduler.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "neuron-scheduler.fullname" . }}
  labels:
    {{- include "neuron-scheduler.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
{{- if .Values.scheduler.customScheduler.enabled }}
- apiGroups: [""]
  resources: ["nodes/status"]
  verbs: ["get", "patch", "update", "list", "watch"]
{{- end }}
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "patch", "update", "list", "watch"]
- apiGroups: [""]
  resources: ["bindings", "pods/binding"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "neuron-scheduler.fullname" . }}
  namespace: {{ include "neuron-scheduler.namespace" . }}
  labels:
    {{- include "neuron-scheduler.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "neuron-scheduler.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "neuron-scheduler.serviceAccountName" . }}
  namespace: {{ include "neuron-scheduler.namespace" . }}
{{- end }}
